name = "minato"
main = "src/index.ts"
# wrangler 4.131.2 同梱の workerd が対応する日付（便りと同じ）
compatibility_date = "2026-08-22"

# 公開口は Access で守った Custom Domain だけ。workers.dev とプレビュー URL は閉じる
workers_dev = false
preview_urls = false

[[routes]]
pattern = "minato.kechiiiiin.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "minato"
# `wrangler d1 create minato` で作ったら、その id に差し替える
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# 1時間ごとに集める（src/index.ts の scheduled）。JST 0〜2時台は前日分も
[triggers]
crons = ["5 * * * *"]

[vars]
# 出どころの本番ホスト（URL は秘密ではない。トークンは secret）。空にするとその出どころはスキップ
TAYORI_URL = "https://tayori.kechiiiiin.com"
NOBU_URL = "https://nobu.kechiiiiin.com"
HEALTH_URL = "https://health.kechiiiiin.com"

[observability]
enabled = true

# Access の JWT の検証は関所（sekisho）に Service Binding の RPC で聞く（src/auth.ts）
[[services]]
binding = "SEKISHO"
service = "sekisho"

# 秘密は `wrangler secret put <名前>` で入れる（ローカルは .dev.vars・コミットしない）。欠けた出どころは黙ってスキップ:
#   CF_ACCESS_AUD               Access アプリ minato の AUD
#   ACCESS_SERVICE_CLIENT_IDS   港を呼べるサービストークンの Client ID（カンマ区切り）。未設定なら1本も通さない
#   TAYORI_CLIENT_ID / TAYORI_CLIENT_SECRET   便りへ付けるサービストークン（kakera-ios）
#   NOBU_CLIENT_ID / NOBU_CLIENT_SECRET       NoBu へ付けるサービストークン
#   HEALTH_CLIENT_ID / HEALTH_CLIENT_SECRET   からだ帳へ付けるサービストークン（health-sync のヘスティア役）
#   WEATHER_LATITUDE / WEATHER_LONGITUDE      天気の場所（座標はリポジトリに書かない）
#   HEVY_API_KEY                              Hevy の API キー（Hevy Pro）
# ⚠️ DEV_BYPASS_AUTH をここ（[vars]）に書かない
